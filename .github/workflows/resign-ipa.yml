name: Liquid Glass 签名 - IPA 重签名

# iOS 26-27 Liquid Glass 签名工具 · IPA 重签名
# 原理：在 Ubuntu Runner 上用 zsign 对 IPA 重新签名（替换签名与描述文件）
# 用法：Actions → 选择本工作流 → Run workflow → 填入参数 → 下载 signed-ipa 工件

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "IPA 文件直链 URL（必填，可将 IPA 上传到任意直链/Release 附件）"
        required: true
        type: string
      cert_base64:
        description: "签名证书 .p12 的 Base64（必填）"
        required: true
        type: string
      cert_password:
        description: ".p12 证书密码（必填）"
        required: true
        type: string
      provision_base64:
        description: "描述文件 .mobileprovision 的 Base64（必填）"
        required: true
        type: string
      new_bundle_id:
        description: "新 Bundle ID（可选，留空则保持原样）"
        required: false
        type: string
      new_display_name:
        description: "新应用名称（可选）"
        required: false
        type: string
      remove_plugins:
        description: "移除无用插件（PlugIns/Watch），可提升安装成功率"
        required: false
        type: boolean
        default: true

jobs:
  resign:
    name: 重签名
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 IPA
        run: curl -fL --retry 3 -o app.ipa "${{ github.event.inputs.ipa_url }}"
      - name: 检查 IPA
        run: |
          ls -lh app.ipa
          file app.ipa

      - name: 解析证书与描述文件
        env:
          CERT_B64: ${{ github.event.inputs.cert_base64 }}
          PROV_B64: ${{ github.event.inputs.provision_base64 }}
          CERT_PWD: ${{ github.event.inputs.cert_password }}
        run: |
          echo "$CERT_B64" | base64 -d > cert.p12
          echo "$PROV_B64" | base64 -d > profile.mobileprovision
          echo "$CERT_PWD" > cert.pwd
          openssl pkcs12 -in cert.p12 -passin file:cert.pwd -info -noout
          ls -lh cert.p12 profile.mobileprovision

      - name: 安装 zsign
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev zlib1g-dev git
          git clone --depth 1 https://github.com/zhlynn/zsign.git
          cd zsign && cmake . && make

      - name: 重签名
        env:
          NEW_BUNDLE_ID: ${{ github.event.inputs.new_bundle_id }}
          NEW_NAME: ${{ github.event.inputs.new_display_name }}
          REMOVE_PLUGINS: ${{ github.event.inputs.remove_plugins }}
          CERT_PWD: ${{ github.event.inputs.cert_password }}
        run: |
          EXTRA=()
          if [ -n "$NEW_BUNDLE_ID" ]; then EXTRA+=(-b "$NEW_BUNDLE_ID"); fi
          if [ -n "$NEW_NAME" ]; then EXTRA+=(-n "$NEW_NAME"); fi
          if [ "$REMOVE_PLUGINS" = "true" ]; then EXTRA+=(-r plugins); fi
          ./zsign/zsign -k cert.p12 -p "$CERT_PWD" -m profile.mobileprovision \
            -z 9 -o signed.ipa "${EXTRA[@]}" app.ipa

      - name: 校验签名结果
        run: |
          ls -lh signed.ipa
          unzip -l signed.ipa | head -n 20

      - name: 上传签名后的 IPA
        uses: actions/upload-artifact@v4
        with:
          name: signed-ipa
          path: signed.ipa
          if-no-files-found: error
