name: LiquidGlassSigner
options:
  minimumXcodeGenVersion: 2.30.0
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

targets:
  LiquidGlassSigner:
    type: application
    platform: iOS
    sources:
      - LiquidGlassSigner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liquidglass.signer
        PRODUCT_NAME: LiquidGlassSigner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Liquid Glass Signer"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  LiquidGlassSigner:
    build:
      targets:
        LiquidGlassSigner: all
    run:
      config: Debug
    archive:
      config: Release
